<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141019" />
    <meta
      name="description"
      content="Gitakure is a quiet countryside RPG whose valley grows from a real GitHub history."
    />
    <title>Gitakure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="game-root">
      <div id="ui-root"></div>
      <div id="screen-layer">
        <div class="screen screen--loading">
          <div class="brand">
            <div class="brand__rule"></div>
            <h1 class="brand__title">Gitakure</h1>
            <p class="brand__sub">A countryside that remembers your code</p>
          </div>
          <div class="loader">
            <div class="loader__track"><span class="loader__fill" style="width: 6%"></span></div>
            <div class="loader__status">Reading the seed</div>
          </div>
        </div>
      </div>
    </div>
    <noscript>Gitakure needs JavaScript to draw the valley.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
